# 公開用アプリ（App Store 用）。自社用は shopify.app.toml。
# 別アプリ・別 Render の設定一覧: docs/APP_AND_RENDER_CONFIG.md
# https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "1758d63a004d7f7d99afe5bf334d1f48"
name = "Location Stock"
application_url = "https://location-stock-indicator.onrender.com"
embedded = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # POS Lite の持ち帰りと配送（会計のあとに配送分を出荷元へ移し、持ち帰り分を履行する。設定が既定オフのあいだは何もしない）
  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  # 必須コンプライアンス Webhook（App Store 審査用。HMAC は authenticate.webhook で検証）
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# POS Lite（店頭受取・持ち帰りと配送）で read_orders・write_orders・read/write_merchant_managed_fulfillment_orders を足した（2026-11-23）。
# 足すと、入れている店で権限の承認がもう一度要る。
scopes = "read_inventory,read_locations,read_products,read_shipping,read_markets,write_app_proxy,read_orders,write_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"

[auth]
redirect_urls = [
  "https://location-stock-indicator.onrender.com/auth/callback",
  "https://location-stock-indicator.onrender.com/api/auth"
]

[app_proxy]
url = "https://location-stock-indicator.onrender.com/apps/location-stock"
subpath = "location-stock"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
