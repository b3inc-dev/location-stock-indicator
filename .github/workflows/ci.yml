name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # lint は既存 baseline 失敗あり。ゲート化は別課題（APP_AND_RENDER_CONFIG 監査参照）
      - name: lint (informational)
        run: npm run lint
        continue-on-error: true
